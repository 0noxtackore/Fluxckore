name: Build & Release

# Releases are tag-driven only (SemVer). No more weekly rebuilds:
# rebuilding every 7 days invalidated SmartScreen reputation each time.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test (imports)
        run: python -c "import fluxckore, fluxckore.app, webview, psutil; print('imports OK', fluxckore.__version__)"

      - name: Read version
        id: version
        shell: bash
        run: |
          # Read the real 3-part __version__ (8.0.2), not the 4-part FileVersion
          # (8.0.2.0), so release asset names stay clean.
          VERSION=$(python -c "import fluxckore; print(fluxckore.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Fluxckore $VERSION"
          # Keep the generated PyInstaller version resource in sync.
          python packaging/make_version_info.py

      - name: Build executable
        run: pyinstaller packaging/fluxckore.spec --noconfirm

      # The onedir build is the final layout: Fluxckore.exe + _internal/.
      # Kept under the Fluxckore-app name so the portable zip reads from a
      # single, predictable folder.
      - name: Select final build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Fluxckore-app | Out-Null
          Copy-Item -Recurse -Force dist/Fluxckore/* dist/Fluxckore-app/
          # Ship the launcher inside the ZIP: it removes the "Mark of the Web"
          # from the downloaded files and starts the app, so end users never
          # have to type a command in PowerShell or cmd. If Fluxckore.exe is
          # missing (Windows blocked or deleted it), it opens the restore
          # assistant instead of failing silently.
          Copy-Item -Force packaging/launcher.bat dist/Fluxckore-app/Run-Fluxckore.bat
          Copy-Item -Force packaging/repair.ps1 dist/Fluxckore-app/Repair-Fluxckore.ps1
          Copy-Item -Force packaging/restore.bat dist/Fluxckore-app/Restaurar-Fluxckore.bat
          Rename-Item -Path "dist/Fluxckore-app/Fluxckore.exe" -NewName "Fluxckore-v0.17.0.exe" -Force

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Fluxckore-app/*" -DestinationPath "dist/Fluxckore-${{ steps.version.outputs.version }}-portable.zip" -Force
          Get-Item "dist/Fluxckore-${{ steps.version.outputs.version }}-portable.zip" | Select-Object Name, Length

      # Releases ship ZIP only (no installer .exe). Unsigned binaries trigger
      # SmartScreen / execution warnings, which is expected until a code-signing
      # license is purchased. Users download the portable zip and extract it.

      # Only for manual runs: a tag build attaches the ZIP to the release below,
      # so uploading it twice only burns the (limited) artifact storage quota.
      # When the quota is exhausted the upload fails and the release is skipped.
      - name: Upload portable zip (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Fluxckore-Portable-${{ steps.version.outputs.version }}
          path: dist/Fluxckore-*-portable.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Replace any previous release for this tag so stale assets (for
          # example from an earlier version-scheme) never linger.
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          gh release create "$TAG" \
            --title "Fluxckore ${{ steps.version.outputs.version }}" \
            --notes "Fluxckore ${{ steps.version.outputs.version }}" \
            --verify-tag \
            "dist/Fluxckore-${{ steps.version.outputs.version }}-portable.zip" \
            "dist/Fluxckore-v0.17.0.exe"
