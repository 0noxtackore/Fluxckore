name: Build & Release

# Releases are tag-driven only (SemVer). No more weekly rebuilds:
# rebuilding every 7 days invalidated SmartScreen reputation each time.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign & package
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test (imports)
        run: python -c "import fluxoptimizer, fluxoptimizer.app, webview, psutil, pygame; print('imports OK', fluxoptimizer.__version__)"

      - name: Read version
        id: version
        shell: bash
        run: |
          # Read the real 3-part __version__ (8.0.2), not the 4-part FileVersion
          # (8.0.2.0), so release asset names stay clean.
          VERSION=$(python -c "import fluxoptimizer; print(fluxoptimizer.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building FluxOptimizer $VERSION"
          # Keep the generated PyInstaller version resource in sync.
          python packaging/make_version_info.py

      - name: Build executable
        run: pyinstaller packaging/fluxoptimizer.spec --noconfirm

      # upload-artifact stores the file as a ZIP archive, which is exactly what
      # SignPath's <zip-file> artifact configuration expects.
      - name: Upload unsigned executable
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FluxOptimizer-unsigned-${{ steps.version.outputs.version }}
          path: dist/FluxOptimizer/FluxOptimizer.exe
          if-no-files-found: error

      # Requires the SignPath GitHub app on this repo + SIGNPATH_API_TOKEN secret.
      # Free for open-source projects: https://signpath.io (OSS plan).
      - name: Sign executable (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: FluxOptimizer
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/FluxOptimizer-signed

      - name: Select final build
        shell: pwsh
        run: |
          if (Test-Path dist/FluxOptimizer-signed) {
            # SignPath extracts the signed exe into the output directory; pair
            # it with the untouched runtime folder of the onedir build.
            New-Item -ItemType Directory -Force -Path dist/FluxOptimizer-app | Out-Null
            Copy-Item -Recurse -Force dist/FluxOptimizer/_internal dist/FluxOptimizer-app/
            Copy-Item -Force dist/FluxOptimizer-signed/FluxOptimizer.exe dist/FluxOptimizer-app/
          } else {
            Write-Host "No signature produced (SignPath not configured) - shipping unsigned build."
            Copy-Item -Recurse -Force dist/FluxOptimizer dist/FluxOptimizer-app
          }

      - name: Build installer (Inno Setup)
        shell: cmd
        run: ISCC.exe /DAppVersion=${{ steps.version.outputs.version }} packaging\FluxOptimizer.iss

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FluxOptimizer-app/*" -DestinationPath "dist/FluxOptimizer-${{ steps.version.outputs.version }}-portable.zip" -Force
          Get-Item "dist/FluxOptimizer-${{ steps.version.outputs.version }}-portable.zip" | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FluxOptimizer-Installer-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "FluxOptimizer ${{ steps.version.outputs.version }}" \
            --notes "FluxOptimizer ${{ steps.version.outputs.version }}" \
            --verify-tag \
            dist/installer/*.exe \
            "dist/FluxOptimizer-${{ steps.version.outputs.version }}-portable.zip" \
          || gh release upload "$TAG" dist/installer/*.exe "dist/FluxOptimizer-${{ steps.version.outputs.version }}-portable.zip" --clobber
