name: Build & Release

# Releases are tag-driven only (SemVer). No more weekly rebuilds:
# rebuilding every 7 days invalidated SmartScreen reputation each time.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test (imports)
        run: python -c "import fluxop, fluxop.app, webview, psutil; print('imports OK', fluxop.__version__)"

      - name: Read version
        id: version
        shell: bash
        run: |
          # Read the real 3-part __version__ (8.0.2), not the 4-part FileVersion
          # (8.0.2.0), so release asset names stay clean.
          VERSION=$(python -c "import fluxop; print(fluxop.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Fluxop $VERSION"
          # Keep the generated PyInstaller version resource in sync.
          python packaging/make_version_info.py

      - name: Build executable
        run: pyinstaller packaging/fluxop.spec --noconfirm

      # The onedir build is the final layout: Fluxop.exe + _internal/.
      # Kept under the Fluxop-app name so the portable zip reads from a
      # single, predictable folder.
      - name: Select final build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Fluxop-app | Out-Null
          Copy-Item -Recurse -Force dist/Fluxop/* dist/Fluxop-app/
          # Ship a launcher inside the ZIP: it removes the "Mark of the Web"
          # from the downloaded files and starts the app, so end users never
          # have to type a command in PowerShell or cmd.
          Copy-Item -Force packaging/launcher.bat dist/Fluxop-app/Run-Fluxop.bat

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Fluxop-app/*" -DestinationPath "dist/Fluxop-${{ steps.version.outputs.version }}-portable.zip" -Force
          Get-Item "dist/Fluxop-${{ steps.version.outputs.version }}-portable.zip" | Select-Object Name, Length

      # Releases ship ZIP only (no installer .exe). Unsigned binaries trigger
      # SmartScreen / execution warnings, which is expected until a code-signing
      # license is purchased. Users download the portable zip and extract it.

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Fluxop-Portable-${{ steps.version.outputs.version }}
          path: dist/Fluxop-*-portable.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Replace any previous release for this tag so stale assets (for
          # example from an earlier version-scheme) never linger.
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          gh release create "$TAG" \
            --title "Fluxop ${{ steps.version.outputs.version }}" \
            --notes "Fluxop ${{ steps.version.outputs.version }}" \
            --verify-tag \
            "dist/Fluxop-${{ steps.version.outputs.version }}-portable.zip"
