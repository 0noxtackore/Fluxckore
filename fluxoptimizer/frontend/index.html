<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FluxOptimizer</title>
<style>
  :root {
    --bg: #050508;
    --card: #0a0a12;
    --line: #1a1a2e;
    --primary: #00d4ff;
    --secondary: #ff00ff;
    --success: #00ff88;
    --warning: #ffaa00;
    --danger: #ff3333;
    --text: #e0e0e0;
    --dim: #888888;
    --mono: Consolas, "Cascadia Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 22px 28px;
    gap: 12px;
  }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 48px; height: 48px; border-radius: 12px; flex: none;
    display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, #003366, #001a33);
    border: 1px solid #0a4a6e;
    box-shadow: 0 0 18px rgba(0, 212, 255, .25);
  }
  h1 {
    font-family: var(--mono); font-size: 22px; color: var(--primary);
    text-shadow: 0 0 12px rgba(0, 212, 255, .45);
  }
  .subtitle { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .header-right { margin-left: auto; }
  select {
    background: #12122a; color: var(--text); border: 1px solid #2a2a4e;
    border-radius: 18px; padding: 7px 12px; font-size: 12px;
    outline: none; cursor: pointer; max-width: 220px;
  }
  select:hover { border-color: var(--primary); }
  .rule {
    height: 2px; border: none;
    background: linear-gradient(90deg, var(--primary), transparent 75%);
  }

  /* ---------- dashboard ---------- */
  .dashboard { display: flex; gap: 14px; align-items: stretch; }
  .ring-card, .temp-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .ring {
    --v: 0; --c: var(--primary);
    width: 104px; height: 104px; border-radius: 50%;
    background: conic-gradient(var(--c) calc(var(--v) * 3.6deg), #141428 0deg);
    display: grid; place-items: center;
  }
  .ring .inner {
    width: 82px; height: 82px; border-radius: 50%; background: var(--card);
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 17px; font-weight: bold;
  }
  #ringCpu .inner { color: var(--primary); }
  #ringRam .inner { color: var(--secondary); }
  .ring-title { font-size: 11px; font-weight: bold; color: var(--dim); letter-spacing: .5px; }
  .temp-card { flex: 1; }
  .temp-count { font-size: 26px; font-weight: bold; color: var(--warning); font-family: var(--mono); }
  .temp-size { font-size: 11px; color: var(--dim); }
  canvas#trend { background: #0d0d1c; border-radius: 8px; margin-top: 4px; }

  /* ---------- log terminal ---------- */
  .terminal {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: #0d1117; border: 2px solid #30363d; border-radius: 12px;
    overflow: hidden;
  }
  .term-head {
    background: #161b22; padding: 7px 12px;
    display: flex; align-items: center; gap: 14px;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .term-title {
    flex: 1; text-align: center; font-family: var(--mono);
    font-size: 10px; color: #8b949e; letter-spacing: 1px;
  }
  .clear-btn {
    background: #21262d; color: #8b949e; border: none; border-radius: 6px;
    font-size: 10px; padding: 4px 12px; cursor: pointer;
  }
  .clear-btn:hover { background: #30363d; color: var(--text); }
  #logs {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
  }
  #logs::-webkit-scrollbar { width: 10px; }
  #logs::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; }
  #logs::-webkit-scrollbar-thumb:hover { background: #484f58; }
  .ts { color: #6e7681; }
  .px { font-weight: bold; }
  .info .px { color: var(--primary); }
  .success .px, .success .msg { color: var(--success); }
  .warning .px, .warning .msg { color: var(--warning); }
  .error .px, .error .msg { color: var(--danger); }
  .gap { height: 12px; }

  /* ---------- action ---------- */
  .action { display: flex; justify-content: center; }
  #btn {
    width: 420px; padding: 15px 0; border: none; border-radius: 12px;
    font-size: 15px; font-weight: bold; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #0077cc, #0055aa);
    box-shadow: 0 0 22px rgba(0, 120, 255, .25);
    transition: box-shadow .2s, transform .1s;
  }
  #btn:hover:not(:disabled) {
    box-shadow: 0 0 34px rgba(0, 212, 255, .55);
    transform: translateY(-1px);
  }
  #btn:disabled { background: #333; color: #999; cursor: wait; box-shadow: none; }

  /* ---------- footer ---------- */
  footer { display: flex; align-items: center; font-size: 11px; color: var(--dim); }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; margin-right: 9px;
    background: var(--success); animation: pulse 2s infinite;
  }
  .status-dot.warn { background: var(--warning); }
  @keyframes pulse { 50% { opacity: .45; } }
  #version { margin-left: auto; font-family: var(--mono); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .65);
    display: none; place-items: center; backdrop-filter: blur(3px);
  }
  .overlay.show { display: grid; }
  .modal {
    width: 380px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 26px; text-align: center;
    box-shadow: 0 0 40px rgba(0, 212, 255, .15);
  }
  .check {
    width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 50%;
    display: grid; place-items: center; font-size: 30px; color: #000;
    background: radial-gradient(circle at 35% 30%, #7dffc4, var(--success));
    box-shadow: 0 0 26px rgba(0, 255, 136, .5);
  }
  .modal h2 { font-size: 17px; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--dim); line-height: 1.6; }
  .modal button {
    margin-top: 18px; width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--success); color: #000; font-size: 14px; font-weight: bold;
    cursor: pointer;
  }
  .modal button:hover { filter: brightness(1.12); }
</style>
</head>
<body>

  <header>
    <div class="logo">⚡</div>
    <div>
      <h1>FluxOptimizer</h1>
      <div class="subtitle" id="subtitle">Maintenance</div>
    </div>
    <div class="header-right">
      <select id="langSelect" title="Language"></select>
    </div>
  </header>
  <hr class="rule">

  <section class="dashboard">
    <div class="ring-card">
      <div class="ring" id="ringCpu"><div class="inner" id="cpuVal">0%</div></div>
      <div class="ring-title" id="cpuTitle">CPU</div>
    </div>
    <div class="ring-card">
      <div class="ring" id="ringRam" style="--c: var(--secondary);"><div class="inner" id="ramVal">0%</div></div>
      <div class="ring-title" id="ramTitle">RAM</div>
    </div>
    <div class="temp-card">
      <div class="ring-title" id="tempTitle">TEMP FILES</div>
      <div class="temp-count" id="tempCount">0</div>
      <div class="temp-size" id="tempSize">0 MB</div>
      <canvas id="trend" width="180" height="42"></canvas>
    </div>
  </section>

  <section class="terminal">
    <div class="term-head">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="term-title" id="logTitle">SYSTEM LOG</div>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
    <div id="logs"></div>
  </section>

  <section class="action">
    <button id="btn"><span id="btnText">🚀 Start</span></button>
  </section>

  <footer>
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">System ready</span>
    <span id="version">v…</span>
  </footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="check">✓</div>
      <h2 id="doneTitle">Optimization complete</h2>
      <p id="doneBody"></p>
      <button id="okBtn">Accept</button>
    </div>
  </div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
let I = { translations: {} };
let running = false;

const t = (k) => I.translations[k] || k;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- frontend API (called by Python) ---------- */
window.UI = {
  onData(p) {
    if (p.stats) renderStats(p.stats);
    (p.logs || []).forEach(addLog);
    (p.events || []).forEach(handleEvent);
  },
};

function renderStats(s) {
  $("#ringCpu").style.setProperty("--v", s.cpu);
  $("#cpuVal").textContent = Math.round(s.cpu) + "%";
  $("#ringRam").style.setProperty("--v", s.ram);
  $("#ramVal").textContent = Math.round(s.ram) + "%";
  $("#tempCount").textContent = s.temp_count;
  $("#tempSize").textContent = s.temp_mb.toFixed(1) + " MB";
  drawTrend(s.trend);
}

function drawTrend(data) {
  const c = $("#trend"), ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  const pts = data || [];
  if (!pts.length || pts.every((v) => v === 0)) return;
  const max = Math.max(...pts), min = Math.min(...pts);
  const pad = 5, span = max - min || 1;
  const xy = pts.map((v, i) => [
    pad + (i / (pts.length - 1)) * (c.width - 2 * pad),
    c.height - pad - ((v - min) / span) * (c.height - 2 * pad),
  ]);
  ctx.strokeStyle = "#ffaa00";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(xy[0][0], xy[0][1]);
  for (let i = 1; i < xy.length; i++) ctx.lineTo(xy[i][0], xy[i][1]);
  ctx.stroke();
  const [dx, dy] = xy[xy.length - 1];
  ctx.fillStyle = "#ffaa00";
  ctx.beginPath();
  ctx.arc(dx, dy, 4, 0, Math.PI * 2);
  ctx.fill();
}

const PREFIX = { info: "[INFO]", success: "[OK]", warning: "[WARN]", error: "[ERR]" };

function addLog(e) {
  const box = $("#logs");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
  const div = document.createElement("div");
  if (!e.message) {
    div.className = "gap";
  } else {
    const type = e.type || "info";
    div.className = "logline " + type;
    div.innerHTML =
      '<span class="ts">[' + esc(e.time) + ']</span> ' +
      '<span class="px">' + (PREFIX[type] || "[INFO]") + "</span> " +
      '<span class="msg">' + esc(e.message) + "</span>";
  }
  box.appendChild(div);
  while (box.children.length > 600) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function handleEvent(ev) {
  if (ev.kind === "summary") {
    $("#doneBody").textContent =
      ev.freed.toFixed(2) + " " + t("mb_freed") + "\n" + ev.deleted + " " + t("files_deleted_count");
    $("#overlay").classList.add("show");
  } else if (ev.kind === "done") {
    running = false;
    $("#btn").disabled = false;
    $("#btnText").textContent = "🚀 " + t("start_optimization");
    setStatus(false, t("optimization_complete"));
  }
}

/* ---------- UI helpers ---------- */
function setStatus(warn, text) {
  $("#statusDot").classList.toggle("warn", !!warn);
  $("#statusText").textContent = text;
}

function applyLang() {
  $("#subtitle").textContent = t("windows_maintenance");
  $("#cpuTitle").textContent = t("cpu_load");
  $("#ramTitle").textContent = t("memory");
  $("#tempTitle").textContent = t("temp_files");
  $("#logTitle").textContent = t("system_log");
  $("#clearBtn").textContent = t("clear");
  $("#doneTitle").textContent = t("optimization_done");
  $("#okBtn").textContent = t("accept");
  if (!running) {
    $("#btnText").textContent = "🚀 " + t("start_optimization");
    setStatus(false, t("system_ready"));
  }
}

function fillLangSelect() {
  const sel = $("#langSelect");
  sel.innerHTML = "";
  (I.lang_options || []).forEach((o) => {
    const opt = document.createElement("option");
    opt.value = o.code;
    opt.textContent = o.flag + " " + o.native;
    if (o.code === I.lang) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = async () => {
    const r = await pywebview.api.set_language(sel.value);
    if (r && r.ok) {
      I.translations = r.translations;
      applyLang();
    }
  };
}

/* ---------- actions ---------- */
async function startOptimization() {
  if (running) return;
  const r = await pywebview.api.start_optimization();
  if (r && r.ok) {
    running = true;
    $("#logs").innerHTML = "";
    $("#btn").disabled = true;
    $("#btnText").textContent = "⏳ " + t("optimization_progress");
    setStatus(true, t("optimization_progress"));
  }
}

$("#btn").addEventListener("click", startOptimization);
$("#clearBtn").addEventListener("click", () => { $("#logs").innerHTML = ""; });
$("#okBtn").addEventListener("click", () => $("#overlay").classList.remove("show"));

/* ---------- init ---------- */
window.addEventListener("pywebviewready", async () => {
  I = await pywebview.api.get_init_data();
  $("#version").textContent = "v" + I.version;
  fillLangSelect();
  applyLang();
});
</script>
</body>
</html>
