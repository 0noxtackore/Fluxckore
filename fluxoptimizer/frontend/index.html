<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FluxOptimizer</title>
<style>
  :root {
    --bg: #04060c;
    --card: #080b14;
    --panel: #0a0e1a;
    --line: #14203a;
    --primary: #00d4ff;
    --secondary: #ff00ff;
    --success: #00ff88;
    --warning: #ffaa00;
    --danger: #ff3333;
    --text: #d7e6f5;
    --dim: #5f7894;
    --mono: Consolas, "Cascadia Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(0, 212, 255, .07), transparent),
      repeating-linear-gradient(0deg, rgba(0, 212, 255, .035) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(0, 212, 255, .035) 0 1px, transparent 1px 44px),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 20px 26px;
    gap: 11px;
  }
  /* CRT scanlines over everything */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  }
  ::selection { background: rgba(0, 212, 255, .3); }

  /* ---------- inline icons ---------- */
  .ico { width: 15px; height: 15px; flex: none; fill: currentColor; }
  .ico.tiny { width: 12px; height: 12px; }
  .ico.big { width: 30px; height: 30px; }
  .ico.bolt { width: 24px; height: 24px; filter: drop-shadow(0 0 8px var(--primary)); }
  .mini-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 8px var(--success);
    vertical-align: 1px; animation: pulse 2s infinite;
  }

  .panel {
    position: relative;
    background: linear-gradient(180deg, var(--panel), var(--card));
    border: 1px solid var(--line);
  }
  /* HUD corner brackets (top-left / bottom-right) */
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
    border-color: var(--primary); opacity: .8;
  }
  .panel::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
  .panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 48px; height: 48px; flex: none; display: grid; place-items: center;
    font-size: 23px; color: var(--primary);
    background: linear-gradient(135deg, #06131f, #030a12);
    border: 1px solid #0d3a55;
    clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%);
    text-shadow: 0 0 14px var(--primary);
  }
  h1 {
    font-family: var(--mono); font-size: 21px; font-weight: bold;
    letter-spacing: 4px; text-transform: uppercase; color: #eaf7ff;
    text-shadow: 0 0 16px rgba(0, 212, 255, .65);
  }
  .subtitle {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--dim); margin-top: 3px; text-transform: uppercase;
  }
  .subtitle::before { content: "[ "; color: var(--primary); }
  .subtitle::after { content: " ]"; color: var(--primary); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sys-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--dim);
    border: 1px solid var(--line); padding: 5px 9px;
  }
  .sys-tag b { color: var(--success); font-weight: normal; }
  select {
    background: #071018; color: var(--text); border: 1px solid #164a68;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    padding: 7px 10px; outline: none; cursor: pointer; max-width: 220px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  select:hover, select:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(0, 212, 255, .35); }
  .rule {
    height: 1px; border: none;
    background: linear-gradient(90deg, var(--primary), rgba(0,212,255,.08) 60%, transparent);
    box-shadow: 0 0 8px rgba(0, 212, 255, .5);
  }

  /* ---------- dashboard ---------- */
  .dashboard { display: flex; gap: 13px; align-items: stretch; }
  .hud-card { padding: 12px 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hud { position: relative; width: 118px; height: 118px; }
  .hud canvas { width: 118px; height: 118px; display: block; }
  .hud-center {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  }
  .hud-center span {
    font-family: var(--mono); font-size: 19px; font-weight: bold;
    text-shadow: 0 0 12px currentColor;
  }
  #cpuVal { color: var(--primary); }
  #ramVal { color: var(--secondary); }
  .hud-center small {
    position: absolute; bottom: 24px; font-family: var(--mono);
    font-size: 8px; letter-spacing: 2px; color: var(--dim);
  }
  .ring-title {
    font-family: var(--mono); font-size: 10px; font-weight: bold;
    letter-spacing: 2px; color: var(--dim); text-transform: uppercase;
  }
  .ring-title::before { content: "// "; color: var(--primary); }

  .temp-card { flex: 1; padding: 12px 18px 10px; align-items: stretch; }
  .temp-head { display: flex; justify-content: space-between; align-items: baseline; }
  .files-badge {
    font-family: var(--mono); font-size: 10px; color: var(--warning);
    border: 1px solid rgba(255, 170, 0, .35); padding: 2px 8px;
    background: rgba(255, 170, 0, .06);
  }
  .gauge-wrap { position: relative; height: 118px; }
  .gauge-wrap canvas { width: 100%; height: 118px; display: block; }
  .gauge-value {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    font-family: var(--mono); font-size: 20px; font-weight: bold; color: var(--success);
    text-shadow: 0 0 14px currentColor;
  }
  .gauge-value small { font-size: 10px; color: var(--dim); letter-spacing: 2px; }
  #trend { width: 100%; height: 40px; display: block; margin-top: 4px; }

  /* ---------- log terminal ---------- */
  .terminal {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: rgba(4, 8, 15, .92); border: 1px solid #16324a;
  }
  .term-head {
    background: linear-gradient(90deg, #081420, #060d16);
    border-bottom: 1px solid #16324a;
    padding: 7px 12px; display: flex; align-items: center; gap: 14px;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.r { background: #ff5f56; box-shadow: 0 0 7px #ff5f56; }
  .dot.y { background: #ffbd2e; box-shadow: 0 0 7px #ffbd2e; }
  .dot.g { background: #27c93f; box-shadow: 0 0 7px #27c93f; animation: pulse 2s infinite; }
  .term-title {
    flex: 1; text-align: center; font-family: var(--mono); font-size: 10px;
    color: #7fb2d9; letter-spacing: 3px; text-transform: uppercase;
  }
  .clear-btn {
    background: #0b1a28; color: #7fb2d9; border: 1px solid #16324a;
    font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
    padding: 4px 12px; cursor: pointer; text-transform: uppercase;
  }
  .clear-btn:hover { color: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px rgba(0,212,255,.3); }
  #logs {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
  }
  #logs::-webkit-scrollbar { width: 10px; }
  #logs::-webkit-scrollbar-thumb { background: #16324a; }
  #logs::-webkit-scrollbar-thumb:hover { background: #1f4a6b; }
  .ts { color: #46627e; }
  .px { font-weight: bold; }
  .msg { color: #b9d4ea; }
  .info .px { color: var(--primary); text-shadow: 0 0 8px rgba(0,212,255,.6); }
  .success .px, .success .msg { color: var(--success); text-shadow: 0 0 8px rgba(0,255,136,.4); }
  .warning .px, .warning .msg { color: var(--warning); text-shadow: 0 0 8px rgba(255,170,0,.4); }
  .error .px, .error .msg { color: var(--danger); text-shadow: 0 0 8px rgba(255,51,51,.5); }
  .gap { height: 12px; }

  /* ---------- action ---------- */
  .action { display: flex; justify-content: center; }
  #btn {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 430px; padding: 15px 0; border: 1px solid #0e5f8a;
    font-family: var(--mono); font-size: 14px; font-weight: bold;
    letter-spacing: 2px; text-transform: uppercase; color: #eaf7ff; cursor: pointer;
    background: linear-gradient(135deg, #063c5c, #04263c);
    text-shadow: 0 0 10px rgba(0, 212, 255, .7);
    box-shadow: 0 0 18px rgba(0, 212, 255, .18), inset 0 0 22px rgba(0, 212, 255, .07);
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    transition: box-shadow .2s;
  }
  #btn:hover:not(:disabled) {
    box-shadow: 0 0 30px rgba(0, 212, 255, .5), inset 0 0 26px rgba(0, 212, 255, .14);
    border-color: var(--primary);
  }
  #btn:disabled { cursor: wait; color: #7fa8c4; border-color: #16324a; background: #06121c; text-shadow: none; }
  #btnSpin { display: none; }
  #btn.busy #btnSpin { display: inline-block; animation: spin .8s linear infinite; }
  #btn.busy #btnIco { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #btn.busy::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, .22), transparent);
    animation: sweep 1.1s linear infinite;
  }
  @keyframes sweep { from { left: -40%; } to { left: 100%; } }

  /* ---------- cleanup options ---------- */
  .options { padding: 9px 16px 11px; }
  .opt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: #08131f; border: 1px solid #16324a; color: var(--dim);
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 11px; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: border-color .15s, background .15s, color .15s;
  }
  .chip .box { width: 9px; height: 9px; flex: none; border: 1px solid #2a4a66; background: #060d16; }
  .chip:hover { border-color: #1f4a6b; color: #9fc3de; }
  .chip.on { color: var(--text); border-color: #0e5f8a; background: rgba(0, 212, 255, .07); }
  .chip.on .box { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 8px var(--primary); }
  .chip.risky { border-color: rgba(255, 170, 0, .3); }
  .chip.risky.on { color: #ffd98a; border-color: var(--warning); background: rgba(255, 170, 0, .07); }
  .chip.risky.on .box { background: var(--warning); border-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
  .chip .warn { color: var(--warning); }
  .chip:disabled { opacity: .4; cursor: not-allowed; }
  .opt-note {
    margin-top: 8px; display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .5px; color: var(--success); opacity: .8;
  }

  /* ---------- footer ---------- */
  footer {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--dim);
    text-transform: uppercase;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 9px var(--success);
    animation: pulse 2s infinite;
  }
  .status-dot.warn { background: var(--warning); box-shadow: 0 0 9px var(--warning); }
  @keyframes pulse { 50% { opacity: .4; } }
  #statusText { color: #9fc3de; }
  #version { margin-left: auto; color: var(--primary); text-shadow: 0 0 8px rgba(0,212,255,.5); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(2, 5, 10, .72);
    display: none; place-items: center; backdrop-filter: blur(3px); z-index: 1000;
  }
  .overlay.show { display: grid; }
  .modal {
    width: 380px; padding: 28px; text-align: center;
    background: linear-gradient(180deg, #0a1220, #060b14);
    border: 1px solid #164a68;
    box-shadow: 0 0 50px rgba(0, 212, 255, .2);
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  }
  .check {
    width: 58px; height: 58px; margin: 0 auto 12px;
    display: grid; place-items: center; color: #04160c;
    background: radial-gradient(circle at 35% 30%, #8dffc9, var(--success));
    box-shadow: 0 0 30px rgba(0, 255, 136, .55);
    clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%);
  }
  .modal h2 {
    font-family: var(--mono); font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--success);
    text-shadow: 0 0 12px rgba(0, 255, 136, .5); margin-bottom: 10px;
  }
  .modal p { font-family: var(--mono); font-size: 13px; color: #9fc3de; line-height: 1.7; white-space: pre-line; }
  .modal button {
    margin-top: 20px; width: 100%; padding: 13px; border: 1px solid var(--success);
    background: rgba(0, 255, 136, .1); color: var(--success);
    font-family: var(--mono); font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .modal button:hover { background: rgba(0, 255, 136, .2); box-shadow: 0 0 18px rgba(0,255,136,.35); }
</style>
</head>
<body>

<!-- Icon set (inline SVG, no external assets) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 L4 14 h6 l-2 8 9-12 h-6 z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 L20 5 v6 c0 5-3.5 9.2-8 11 -4.5-1.8-8-6-8-11 V5 z"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 L22.5 21 H1.5 z M11 9 h2 v6 h-2 z M11 17 h2 v2 h-2 z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-spin" viewBox="0 0 24 24"><path d="M12 3 a9 9 0 1 1-9 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  </defs>
</svg>

  <header>
    <div class="logo"><svg class="ico bolt"><use href="#i-bolt"/></svg></div>
    <div>
      <h1>FluxOptimizer</h1>
      <div class="subtitle" id="subtitle">Maintenance</div>
    </div>
    <div class="header-right">
      <span class="sys-tag">SYS <span class="mini-dot"></span> ONLINE</span>
      <select id="langSelect" title="Language"></select>
    </div>
  </header>
  <hr class="rule">

  <section class="dashboard">
    <div class="panel hud-card">
      <div class="hud">
        <canvas id="cpuCv"></canvas>
        <div class="hud-center"><span id="cpuVal">0%</span><small>CORE</small></div>
      </div>
      <div class="ring-title" id="cpuTitle">CPU</div>
    </div>
    <div class="panel hud-card">
      <div class="hud">
        <canvas id="ramCv"></canvas>
        <div class="hud-center"><span id="ramVal">0%</span><small>MEM</small></div>
      </div>
      <div class="ring-title" id="ramTitle">RAM</div>
    </div>
    <div class="panel temp-card">
      <div class="temp-head">
        <div class="ring-title" id="tempTitle">TEMP FILES</div>
        <span class="files-badge"><span id="tempCount">0</span> FILES</span>
      </div>
      <div class="gauge-wrap">
        <canvas id="gauge"></canvas>
        <div class="gauge-value"><span id="tempSize">0.0</span> <small>MB</small></div>
      </div>
      <canvas id="trend"></canvas>
    </div>
  </section>

  <section class="terminal panel">
    <div class="term-head">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="term-title" id="logTitle">SYSTEM LOG</div>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
    <div id="logs"></div>
  </section>

  <section class="panel options">
    <div class="opt-head">
      <div class="ring-title" id="optTitle">CLEANUP OPTIONS</div>
      <button class="clear-btn" id="optReset">Reset</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="opt-note" id="optNote"><svg class="ico tiny"><use href="#i-shield"/></svg><span id="optNoteText"></span></div>
  </section>

  <section class="action">
    <button id="btn">
      <svg class="ico" id="btnIco"><use href="#i-bolt"/></svg>
      <svg class="ico spin" id="btnSpin"><use href="#i-spin"/></svg>
      <span id="btnText">START</span>
    </button>
  </section>

  <footer>
    <span class="status-dot" id="statusDot"></span>
    <span>STATUS:</span>
    <span id="statusText">System ready</span>
    <span id="version">v…</span>
  </footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="check"><svg class="ico big"><use href="#i-check"/></svg></div>
      <h2 id="doneTitle">Optimization complete</h2>
      <p id="doneBody"></p>
      <button id="okBtn">Accept</button>
    </div>
  </div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
let I = { translations: {} };
let running = false;

/* ---------- cleanup category selection ---------- */
let catsMeta = [];          // [{id, default, risky}] from the backend
let catsSel = new Set();    // selected category ids

// Labels (i18n overridable via cat_<id> translation keys).
const CAT_LABELS = {
  es: {
    temp_user: "Temp de usuario",
    temp_windows: "Temp de Windows",
    updates: "Windows Update",
    logs: "Logs del sistema",
    explorer: "Caché de Explorer",
    gpu_cache: "Caché GPU / shaders",
    browsers_cache: "Caché de navegadores",
    browsers_storage: "Datos de sesión",
    store_cache: "Cachés de apps Store",
    recycle: "Papelera de reciclaje",
    registry: "Registro (MRU)",
  },
  en: {
    temp_user: "User temp",
    temp_windows: "Windows temp",
    updates: "Windows Update",
    logs: "System logs",
    explorer: "Explorer cache",
    gpu_cache: "GPU / shader cache",
    browsers_cache: "Browser cache",
    browsers_storage: "Session data",
    store_cache: "Store app caches",
    recycle: "Recycle bin",
    registry: "Registry (MRU)",
  },
};

function isEs() {
  return (I.lang || "").toLowerCase().startsWith("es");
}

function catLabel(id) {
  const v = I.translations["cat_" + id];
  if (v && v !== "cat_" + id) return v;
  const dict = CAT_LABELS[isEs() ? "es" : "en"] || CAT_LABELS.en;
  return dict[id] || id;
}

function catTooltip(cat) {
  if (!cat.risky) return "";
  return isEs()
    ? "Puede cerrar sesiones o borrar datos locales de esa app"
    : "May close sessions or delete local app data";
}

function loadCats() {
  try {
    const saved = JSON.parse(localStorage.getItem("flux_cats"));
    if (Array.isArray(saved)) {
      const valid = new Set(catsMeta.map((c) => c.id));
      const filtered = saved.filter((id) => valid.has(id));
      if (filtered.length) return new Set(filtered);
    }
  } catch (e) { /* first run or corrupted data */ }
  return new Set(catsMeta.filter((c) => c.default).map((c) => c.id));
}

function saveCats() {
  try { localStorage.setItem("flux_cats", JSON.stringify([...catsSel])); } catch (e) { /* ignore */ }
}

function renderChips() {
  const box = $("#chips");
  box.innerHTML = "";
  catsMeta.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (c.risky ? " risky" : "");
    b.title = catTooltip(c);
    const mark = c.risky ? '<svg class="ico tiny warn"><use href="#i-warn"/></svg>' : "";
    b.innerHTML = '<span class="box"></span><span class="lbl"></span>' + mark;
    b.querySelector(".lbl").textContent = catLabel(c.id);
    b.classList.toggle("on", catsSel.has(c.id));
    b.addEventListener("click", () => {
      if (catsSel.has(c.id)) catsSel.delete(c.id);
      else catsSel.add(c.id);
      b.classList.toggle("on", catsSel.has(c.id));
      saveCats();
    });
    box.appendChild(b);
  });
}

const t = (k) => I.translations[k] || k;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- live state ---------- */
let stats = { cpu: 0, ram: 0, temp_count: 0, temp_mb: 0, trend: [0] };
let gaugeMax = 50;
let gaugeShown = 0;
let rot = 0;

/* ---------- frontend API (called by Python) ---------- */
window.UI = {
  onData(p) {
    if (p.stats) {
      stats = p.stats;
      gaugeMax = scaleMax(stats.temp_mb);
      $("#cpuVal").textContent = Math.round(stats.cpu) + "%";
      $("#ramVal").textContent = Math.round(stats.ram) + "%";
      $("#tempCount").textContent = stats.temp_count;
      $("#tempSize").textContent = stats.temp_mb.toFixed(1);
      drawTrend(stats.trend);
    }
    (p.logs || []).forEach(addLog);
    (p.events || []).forEach(handleEvent);
  },
};

/* ---------- canvas helpers ---------- */
const dpr = () => window.devicePixelRatio || 1;

function fit(cv) {
  const d = dpr();
  const w = Math.round(cv.clientWidth * d), h = Math.round(cv.clientHeight * d);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return cv.getContext("2d");
}

/* HUD ring: tick track + glowing progress arc + rotating dashed circle */
function drawRing(cv, pct, color) {
  const ctx = fit(cv);
  const d = dpr();
  const c = cv.width / 2, R = c - 4 * d;
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.save();
  ctx.translate(c, c);
  ctx.rotate(rot);
  ctx.strokeStyle = "rgba(0, 212, 255, .3)";
  ctx.setLineDash([2 * d, 7 * d]);
  ctx.lineWidth = d;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  const ticks = 44;
  for (let i = 0; i < ticks; i++) {
    const a = (i / ticks) * Math.PI * 2 - Math.PI / 2;
    const on = (i / ticks) * 100 <= pct;
    const r1 = R - 7 * d, r2 = r1 - (on ? 7 * d : 4 * d);
    ctx.strokeStyle = on ? color : "rgba(110, 140, 180, .16)";
    ctx.lineWidth = 2 * d;
    ctx.beginPath();
    ctx.moveTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1);
    ctx.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2);
    ctx.stroke();
  }

  if (pct > 0.5) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5 * d;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12 * d;
    ctx.beginPath();
    ctx.arc(c, c, R - 18 * d, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

/* Trading-style speedometer: green/amber/red zones, ticks, needle */
function scaleMax(mb) {
  const steps = [25, 50, 100, 250, 500, 1000, 2000, 5000, 10000];
  for (const s of steps) if (mb <= s * 0.85) return s;
  return Math.ceil(mb / 5000) * 5000;
}

function drawGauge(value) {
  const cv = $("#gauge");
  const ctx = fit(cv);
  const d = dpr();
  const cx = cv.width / 2, cy = cv.height * 0.86;
  const R = Math.min(cv.width * 0.42, cv.height * 0.78);
  ctx.clearRect(0, 0, cv.width, cv.height);

  const zones = [
    [0, 0.4, "#00ff88"],
    [0.4, 0.7, "#ffaa00"],
    [0.7, 1, "#ff3333"],
  ];
  for (const [a, b, col] of zones) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 6 * d;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(cx, cy, R, Math.PI + a * Math.PI, Math.PI + b * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  const n = 28;
  for (let i = 0; i <= n; i++) {
    const frac = i / n, a = Math.PI + frac * Math.PI;
    const r1 = R - 10 * d, r2 = r1 - (i % 7 === 0 ? 8 * d : 4 * d);
    ctx.strokeStyle = i % 7 === 0 ? "rgba(0, 212, 255, .75)" : "rgba(120, 150, 190, .3)";
    ctx.lineWidth = 1.4 * d;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    ctx.stroke();
  }

  ctx.fillStyle = "#46627e";
  ctx.font = 9 * d + "px Consolas";
  ctx.textAlign = "center";
  ctx.fillText("0", cx - R + 4 * d, cy + 13 * d);
  ctx.fillText(String(gaugeMax), cx + R - 4 * d, cy + 13 * d);

  const frac = Math.min(value / gaugeMax, 1);
  const col = frac < 0.4 ? "#00ff88" : frac < 0.7 ? "#ffaa00" : "#ff3333";
  const a = Math.PI + frac * Math.PI;
  const nx = cx + Math.cos(a) * (R - 16 * d), ny = cy + Math.sin(a) * (R - 16 * d);

  ctx.strokeStyle = "rgba(230, 250, 255, .95)";
  ctx.lineWidth = 2 * d;
  ctx.shadowColor = col;
  ctx.shadowBlur = 12 * d;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(nx, ny);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(nx, ny, 3.5 * d, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#050a14";
  ctx.strokeStyle = "rgba(0, 212, 255, .85)";
  ctx.lineWidth = 1.5 * d;
  ctx.beginPath();
  ctx.arc(cx, cy, 7 * d, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  const el = $(".gauge-value");
  el.style.color = col;
}

/* Mini trading chart for the temp trend */
function drawTrend(data) {
  const cv = $("#trend");
  const ctx = fit(cv);
  const d = dpr();
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = "rgba(0, 212, 255, .12)";
  ctx.lineWidth = d;
  ctx.setLineDash([3 * d, 5 * d]);
  for (let i = 1; i < 3; i++) {
    const y = (cv.height / 3) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(cv.width, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  const pts = data || [];
  if (!pts.length || pts.every((v) => v === 0)) return;
  const max = Math.max(...pts), min = Math.min(...pts);
  const pad = 6 * d, span = max - min || 1;
  const xy = pts.map((v, i) => [
    pad + (i / (pts.length - 1)) * (cv.width - 2 * pad),
    cv.height - pad - ((v - min) / span) * (cv.height - 2 * pad),
  ]);

  const grad = ctx.createLinearGradient(0, 0, 0, cv.height);
  grad.addColorStop(0, "rgba(255, 170, 0, .28)");
  grad.addColorStop(1, "rgba(255, 170, 0, 0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(xy[0][0], cv.height);
  xy.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(xy[xy.length - 1][0], cv.height);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#ffaa00";
  ctx.lineWidth = 1.8 * d;
  ctx.lineJoin = "round";
  ctx.shadowColor = "#ffaa00";
  ctx.shadowBlur = 6 * d;
  ctx.beginPath();
  ctx.moveTo(xy[0][0], xy[0][1]);
  for (let i = 1; i < xy.length; i++) ctx.lineTo(xy[i][0], xy[i][1]);
  ctx.stroke();
  ctx.shadowBlur = 0;

  const [dx, dy] = xy[xy.length - 1];
  ctx.fillStyle = "#ffaa00";
  ctx.beginPath();
  ctx.arc(dx, dy, 3.2 * d, 0, Math.PI * 2);
  ctx.fill();
}

/* animation loop: rotating rings + smooth needle */
function frame() {
  rot += 0.005;
  drawRing($("#cpuCv"), stats.cpu, "#00d4ff");
  drawRing($("#ramCv"), stats.ram, "#ff00ff");
  if (Math.abs(gaugeShown - stats.temp_mb) > 0.02) {
    gaugeShown += (stats.temp_mb - gaugeShown) * 0.08;
  } else {
    gaugeShown = stats.temp_mb;
  }
  drawGauge(gaugeShown);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- logs ---------- */
const PREFIX = { info: "[INFO]", success: "[OK]", warning: "[WARN]", error: "[ERR]" };

function addLog(e) {
  const box = $("#logs");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
  const div = document.createElement("div");
  if (!e.message) {
    div.className = "gap";
  } else {
    const type = e.type || "info";
    div.className = "logline " + type;
    div.innerHTML =
      '<span class="ts">[' + esc(e.time) + ']</span> ' +
      '<span class="px">' + (PREFIX[type] || "[INFO]") + "</span> " +
      '<span class="msg">' + esc(e.message) + "</span>";
  }
  box.appendChild(div);
  while (box.children.length > 600) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function handleEvent(ev) {
  if (ev.kind === "summary") {
    $("#doneBody").textContent =
      ev.freed.toFixed(2) + " " + t("mb_freed") + "\n" + ev.deleted + " " + t("files_deleted_count");
    $("#overlay").classList.add("show");
  } else if (ev.kind === "done") {
    running = false;
    $("#btn").disabled = false;
    $("#btn").classList.remove("busy");
    $("#btnText").textContent = t("start_optimization");
    setStatus(false, t("optimization_complete"));
  }
}

/* ---------- UI helpers ---------- */
function setStatus(warn, text) {
  $("#statusDot").classList.toggle("warn", !!warn);
  $("#statusText").textContent = text;
}

function applyLang() {
  $("#subtitle").textContent = t("windows_maintenance");
  $("#cpuTitle").textContent = t("cpu_load");
  $("#ramTitle").textContent = t("memory");
  $("#tempTitle").textContent = t("temp_files");
  $("#logTitle").textContent = t("system_log");
  $("#clearBtn").textContent = t("clear");
  $("#doneTitle").textContent = t("optimization_done");
  $("#okBtn").textContent = t("accept");
  $("#optTitle").textContent = isEs() ? "OPCIONES DE LIMPIEZA" : "CLEANUP OPTIONS";
  $("#optReset").textContent = isEs() ? "Restaurar" : "Reset";
  $("#optNoteText").textContent = isEs()
    ? "WhatsApp siempre protegido: su sesión nunca se borra"
    : "WhatsApp always protected: its session is never deleted";
  if (catsMeta.length) renderChips();
  if (!running) {
    $("#btnText").textContent = t("start_optimization");
    setStatus(false, t("system_ready"));
  }
}

function fillLangSelect() {
  const sel = $("#langSelect");
  sel.innerHTML = "";
  (I.lang_options || []).forEach((o) => {
    const opt = document.createElement("option");
    opt.value = o.code;
    opt.textContent = "[" + o.code.toUpperCase() + "] " + o.native;
    if (o.code === I.lang) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = async () => {
    const r = await pywebview.api.set_language(sel.value);
    if (r && r.ok) {
      I.translations = r.translations;
      applyLang();
    }
  };
}

/* ---------- actions ---------- */
async function startOptimization() {
  if (running) return;
  if (!catsSel.size) {
    setStatus(true, isEs()
      ? "Selecciona al menos una categoría de limpieza"
      : "Select at least one cleanup category");
    return;
  }
  const r = await pywebview.api.start_optimization([...catsSel]);
  if (r && r.ok) {
    running = true;
    $("#logs").innerHTML = "";
    $("#btn").disabled = true;
    $("#btn").classList.add("busy");
    $("#btnText").textContent = t("optimization_progress");
    setStatus(true, t("optimization_progress"));
  }
}

$("#btn").addEventListener("click", startOptimization);
$("#clearBtn").addEventListener("click", () => { $("#logs").innerHTML = ""; });
$("#okBtn").addEventListener("click", () => $("#overlay").classList.remove("show"));
$("#optReset").addEventListener("click", () => {
  catsSel = new Set(catsMeta.filter((c) => c.default).map((c) => c.id));
  saveCats();
  renderChips();
});

/* ---------- init ---------- */
window.addEventListener("pywebviewready", async () => {
  I = await pywebview.api.get_init_data();
  $("#version").textContent = "v" + I.version;
  catsMeta = Array.isArray(I.categories) ? I.categories : [];
  catsSel = loadCats();
  fillLangSelect();
  applyLang();
});
</script>
